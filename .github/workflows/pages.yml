name: Webseite veröffentlichen

# Baut die Webseite und legt sie auf GitHub Pages ab.
#
# Einmalig nötig: Settings → Pages → Source: "GitHub Actions".
#
# Ohne Serveradresse läuft die Seite im lokalen Modus, also komplett im
# Browser mit den Beispieldaten. Wer sie gegen einen erreichbaren Server
# laufen lassen will, trägt die Adresse beim Start von Hand ein (Feld "api")
# oder setzt das Repository-Variable VITE_API.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api:
        description: 'Serveradresse (leer = lokaler Modus im Browser)'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Übersetzungen prüfen
        run: npm run pruefen:i18n

      - name: Bauen
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_API: ${{ github.event.inputs.api || vars.VITE_API }}
        run: npm run build

      - name: Fallback für Unterseiten
        # Pages kennt nur Dateien; die Adressen entstehen erst im Browser.
        # Ohne diese Kopie gibt jeder direkte Aufruf einer Unterseite 404.
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
